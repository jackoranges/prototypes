<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目原型</title>
<style>
  :root { --bg:#f5f3f1; --panel:#fff; --ink:#2a2522; --muted:#7a6f69; --line:#e6ddd7; --brand:#ff5a1f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1817; --panel:#262220; --ink:#f2ebe6; --muted:#b3a69e; --line:#3a3330; --brand:#ff7a45; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:40px 16px; }
  h1 { font-size:26px; margin:0 0 6px; }
  p.lead { color:var(--muted); margin:0 0 24px; }
  a.card { display:block; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:12px; color:inherit; text-decoration:none; }
  a.card:hover { border-color:var(--brand); }
  a.card b { font-size:17px; }
  a.card span { display:block; color:var(--muted); font-size:14px; margin-top:4px; }
</style>
</head>
<body>
<main>
  <h1>项目原型</h1>
  <p class="lead">产品原型和演示资料。原型只有演示数据，不接真实后台；数据存在你自己的浏览器里，各看各的，互不影响。</p>
  <a class="card" href="nuanling/">
    <b>暖龄生活 · 银发私域直播</b>
    <span>会员手机端和电脑后台（平台、供应商、SaaS 总后台），右边有“按角色走查”。演示账号见页面里“全部演示账号”，验证码 123456。</span>
  </a>
</main>
</body>
</html>
